<title id="t">Blason solaire de la Seigneurie Adjaoudi</title>
<desc id="d">Ecu cramoisi charge d'un soleil d'or a seize rayons, filet d'ivoire, crete geometrique et deux branches de laurier. Embleme familial et culturel ; il ne represente aucune autorite publique.</desc>
